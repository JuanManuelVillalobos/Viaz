services:
  backend:
    image: "juanmanuelv/viaz-dashboard:latest"
    ports:
      - "80:8080"
    restart: "always"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - DEFAULT_ADMIN_USER=${DEFAULT_ADMIN_USER}
      - FRONTEND_URL=${FRONTEND_URL}
      - JWT_SECRET=${JWT_SECRET}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
      - VIAZ_DATABASE_PASSWORD=${VIAZ_DATABASE_PASSWORD}
      - RATE_LIMIT=${RATE_LIMIT}
      - AWS_REGION=${AWS_REGION}
      - SHIPMENT_RATING_WEIGHT=${SHIPMENT_RATING_WEIGHT}
      - CUSTOMER_SERVICE_RATING_WEIGHT=${CUSTOMER_SERVICE_RATING_WEIGHT}
      - VIAZ_ID_START_NUMBER=${VIAZ_ID_START_NUMBER}
