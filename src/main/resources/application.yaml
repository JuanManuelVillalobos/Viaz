#### SPRING
spring:

  #### FLYWAY
  flyway:
    url: jdbc:postgresql://localhost:5432/viaz
    user: postgres
    baseline-on-migrate: true
  ####

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  ####

  ### CACHE
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60m

  ###


  ### JACKSON
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  ###


  ### DATABASE
  datasource:
    url: jdbc:postgresql://localhost:5432/viaz
    username:
    password:
  jpa:
    properties:
      hibernate:
        dialect:
          org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  ###


  ### EMAIL SERVICE
  mail:
    host: smtp.gmail.com
    port: 587
    username: viazdashboard@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
  ###
  http:
    codecs:
      max-in-memory-size: 10MB


####

### DEBUG LEVEL
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
  #   TODO check if url is secure, otherwise the cookie will not be sent
  error:
    include-message: always
#    UNCOMMENT ADDRESS WHEN WANTING TO EXPOSE TO LAN
#  address: 0.0.0.0
logging:
  level:
    org.springframework.mail: debug
    org.springframework.web.socket: debug
    org.springframework.messaging: debug

  ###

### JWT SECRET KEY
jwt:
  secret:
    key: ${JWT_SECRET}
###

### RATING WEIGHTS
rating:
  weight:
    carrier: ${CARRIER_RATING_WEIGHT:0.25}
    client: ${CLIENT_RATING_WEIGHT:0.25}
    carrierCustomerService: ${CARRIER_CUSTOMER_SERVICE_RATING_WEIGHT:0.25}
    clientCustomerService: ${CLIENT_CUSTOMER_SERVICE_RATING_WEIGHT:0.25}
###

### Default user after start
default:
  admin:
    user: ${DEFAULT_ADMIN_USER}
    password: ${DEFAULT_ADMIN_PASSWORD}
###


### FrontUrl
frontend:
  url: ${FRONTEND_URL}
###

### Viaz ID start
migration:
  viazIdStartNumber: ${VIAZ_ID_START_NUMBER}

### RATE LIMIT
rate:
  limit:
    pass: false
    capacity: ${RATE_LIMIT}
    time: 1
###

### AWS
aws:
  region: ${AWS_REGION}
  bucket:
    main: viazdocuments
  s3:
    mock: false
###