#### SPRING
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  codec:
    max-in-memory-size: 10MB


  ### CACHE
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60m
  ###

  ### DATABASE
  datasource:
    url: jdbc:postgresql://localhost:5432/student
    username:
    password:
  jpa:
    properties:
      hibernate:
        dialect:
          org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    hibernate:
      ddl-auto: update
    show-sql: true
  ###
  ### EMAIL SERVICE
  mail:
    host: smtp.gmail.com
    port: 587
    username: viazdashboard@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
  ###
####

### DEBUG LEVEL
server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
#   TODO check if url is secure, otherwise the cookie will not be sent
  error:
    include-message: always
logging:
  level:
    org.springframework.mail: debug
  ###

### JWT SECRET KEY
jwt:
  secret:
    key: ${JWT_SECRET}
###

### Default user after start
default:
  admin:
    user: ${DEFAULT_ADMIN_USER}
    password: ${DEFAULT_ADMIN_PASSWORD}
###


### FrontUrl
frontend:
  url: ${FRONTEND_URL}
###

### RATE LIMIT
rate:
  limit:
    pass: false
    capacity: ${RATE_LIMIT}
    time: 1


###

### AWS
aws:
  region: US_EAST_1
  s3:
    mock: true
###