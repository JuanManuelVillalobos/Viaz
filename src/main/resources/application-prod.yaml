#### SPRING
spring:
### DATABASE
  datasource:
    url: jdbc:postgresql://${DATABASE_URL}:5432/postgres
    username: ViazDatabase
    password: ${VIAZ_DATABASE_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect:
           org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    hibernate:
      ddl-auto: update
    show-sql: false
  ###
  ### EMAIL SERVICE
  mail:
    host: smtp.gmail.com
    port: 587
    username: viazdashboard@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
     mail:
       smtp:
         auth: true
         starttls.enable: true
 ###
